<div id="art"></div>
<style>
  html, body { margin: 0; background: #07031a; }
  #art {
    width: 800px;
    height: 800px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 50%, #1e0b4d 0%, #0d0530 55%, #07031a 100%);
  }
  /* Radial spokes, matching the in-game backdrop */
  #art::before {
    content: '';
    position: absolute;
    inset: -20%;
    background: repeating-conic-gradient(
      from 0deg at 50% 50%,
      rgba(106, 43, 217, 0.22) 0deg 2deg,
      transparent 2deg 20deg
    );
  }
  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
  }
  .halo {
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(0,240,255,0.20) 0%, rgba(0,240,255,0) 70%);
  }
  /* Shield arc: a ring clipped to roughly one third of the circle */
  .shield {
    width: 470px; height: 470px;
    border: 26px solid #00f0ff;
    box-shadow: 0 0 60px rgba(0,240,255,0.75), inset 0 0 30px rgba(0,240,255,0.5);
    clip-path: polygon(50% 50%, 120% -10%, 130% 60%, 50% 50%);
    transform: translate(-50%, -50%) rotate(-32deg);
  }
  .core-glow {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(125,249,255,0.55) 0%, rgba(0,240,255,0) 68%);
  }
  .core {
    width: 190px; height: 190px;
    background: radial-gradient(circle at 50% 45%, #ffffff 0%, #7df9ff 38%, #0aa6d8 100%);
    box-shadow: 0 0 70px rgba(0,240,255,0.9);
  }
  .core-edge {
    width: 240px; height: 240px;
    border: 4px solid rgba(0,240,255,0.9);
    box-shadow: 0 0 24px rgba(0,240,255,0.6);
  }
  /* Two incoming shards for motion, one cyan and one hot pink */
  .shard {
    position: absolute;
    border-radius: 50%;
    box-shadow: 0 0 26px currentColor;
  }
  .shard.a { width: 40px; height: 40px; left: 130px; top: 560px; color: #22e8ff; border: 8px solid #22e8ff; }
  .shard.b { width: 34px; height: 34px; left: 610px; top: 170px; color: #ff2d95; border: 7px solid #ff2d95; }
</style>
<div class="ring halo"></div>
<div class="ring core-glow"></div>
<div class="ring shield"></div>
<div class="ring core-edge"></div>
<div class="ring core"></div>
<div class="shard a"></div>
<div class="shard b"></div>
